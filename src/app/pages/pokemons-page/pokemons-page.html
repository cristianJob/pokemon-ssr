<div class="container mx-auto">
<h1 class="text-3xl">Listado de Pokemons</h1>
<h2 class="text-xl">
    Pagina Actual: {{currentPage()}}
</h2>
<hr class="my-2" />

@if (isLoading()) {
    <app-pokemon-list-skeleton />
} @else {
    <app-pokemon-list [pokemons]="pokemons()" />
}

    <div class="flex justify-between">
        <button (click)="loadPokemons(-1)" class="mt-2">
            Anterior
        </button> 
        <button (click)="loadPokemons(+ 1)" class="mt-2">
            Siguiente
        </button> 
    </div>
</div>
